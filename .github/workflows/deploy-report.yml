name: Deploy Report

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
        if: success()
      - name: Deploy report
        run: npm run deploy:report
        if: success()

